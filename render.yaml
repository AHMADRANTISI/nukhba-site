# Render Blueprint: one web service + one Postgres database.
# Render → New → Blueprint → pick this repo. Secrets are generated by Render.
services:
  - type: web
    # The service name sets the URL: https://turbo-boost.onrender.com
    name: turbo-boost
    runtime: node
    plan: free
    region: frankfurt
    # Locally we use SQLite; on Render the schema is switched to Postgres before building.
    buildCommand: node scripts/use-postgres.mjs && npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npm run start:render
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: nukhba-db
          property: connectionString
      - key: CRED_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@nukhba.test
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DEMO_PASSWORD
        generateValue: true
      # Loads the demo customer, bookings and reviews on start. Set to "false" before launch.
      - key: SEED_DEMO
        value: "true"

databases:
  - name: nukhba-db
    plan: free
    region: frankfurt
